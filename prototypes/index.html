<!doctype html>
<!-- Throwaway design review: three mobile-first translator layouts. Not a production page. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Morse translator — three mobile design directions</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="review-layout">
    <aside class="review-intro" lang="zh-CN">
      <div class="review-kicker">SIGNAL DESK / DESIGN STUDY 01</div>
      <h2>小屏幕。<br>完整的工具。</h2>
      <p>从 Morse 出发的编码工具站。<br>同一个任务，三种体验。</p>
      <div class="review-rule"></div>
      <span class="review-tag">移动端优先</span>
      <p class="review-small">可输入、双向转换、复制、播放与下载 WAV。品牌名暂定；这是视觉评审原型。</p>
      <button id="viewport-toggle" class="review-button">查看桌面布局 ↗</button>
    </aside>
    <div class="device-wrap"><div class="device-label" lang="zh-CN">390 PX · 手机布局预览</div><div id="app" class="app"></div></div>
    <aside id="design-notes" class="review-notes" lang="zh-CN"></aside>
  </div>
  <nav class="prototype-switcher" aria-label="Design variants" lang="zh-CN">
    <button id="previous" aria-label="上一个方案">←</button>
    <button data-variant="A">A <span>清晰工具台</span></button>
    <button data-variant="B">B <span>信号控制台</span></button>
    <button data-variant="C">C <span>纸上电报码</span></button>
    <button id="next" aria-label="下一个方案">→</button>
  </nav>
  <script type="module" src="/app.js"></script>
</body>
</html>
